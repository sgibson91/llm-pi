---
# Location where configuration files will be stored.
config_dir: /opt/ollama-n8n

# Ollama configuration.
ollama_models:
  - "llama3.2:1b"
ollama_port: 11434
# Uncomment to constrain resources on a 4 GB Pi:
# ollama_num_parallel: 1
# ollama_max_loaded_models: 1

# n8n configuration.
n8n_port: 5678
n8n_webhook_host: localhost
# Uncomment to pre-provision the n8n instance owner (skips setup screen):
# n8n_owner_email: you@example.com
# n8n_owner_first_name: Your
# n8n_owner_last_name: Name
# n8n_owner_password_hash: "$2b$10$..." # bcrypt hash of your password
