---
- name: Configure LLM Pi.
  hosts: llm_pi
  become: true

  pre_tasks:
    - name: Load configuration (with defaults from example file).
      ansible.builtin.include_vars: "{{ item }}"
      loop:
        - example.config.yml
        - config.yml

    - name: Ensure apt cache is up to date.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure base packages are installed.
      ansible.builtin.apt:
        name:
          - python3
          - yq
        state: present

    # When running over SSH (i.e. not a local connection), install Ansible
    # and its collection requirements.
    - name: Install Ansible on the host (remote connections only).
      ansible.builtin.command: python -m pip install ansible
      changed_when: false
      when: ansible_connection | default('ssh') != 'local'

    - name: Install Ansible collection requirements on the host (remote connections only).
      ansible.builtin.command: ansible-galaxy collection install -r requirements.yml
      args:
        chdir: "{{ playbook_dir }}"
      changed_when: false
      when: ansible_connection | default('ssh') != 'local'

    - name: Set up myrepos.
      ansible.builtin.import_tasks: tasks/myrepos.yml

  handlers:
    - name: Include handlers.
      ansible.builtin.import_tasks: tasks/handlers.yml

  tasks:
    - name: Setup Docker.
      ansible.builtin.import_tasks: tasks/docker.yml

    - name: Set up Ollama + n8n.
      ansible.builtin.import_tasks: tasks/ollama-n8n.yml

    - name: Set up automatic image updates.
      ansible.builtin.import_tasks: tasks/update.yml
